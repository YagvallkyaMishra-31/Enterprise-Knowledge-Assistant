spring:
  application:
    name: knowledge-assistant-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:knowledge_assistant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  rag-service-url: ${RAG_SERVICE_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY:default-dev-key}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpcy1pcy1hLXBsYWNlaG9sZGVyLXNlY3JldC1rZXktZm9yLWRldi1vbmx5LTMyYg==}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

  upload:
    root-path: ${UPLOAD_ROOT_PATH:/tmp/knowledge-assistant-uploads}
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:50}
    allowed-extensions: ${UPLOAD_ALLOWED_EXTENSIONS:pdf,txt,md}
