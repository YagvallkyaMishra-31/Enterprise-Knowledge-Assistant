# Production Docker Compose for Oracle Cloud VPS (Linux ARM64)
# Key differences from local docker-compose.yml:
#   - OLLAMA_BASE_URL uses Docker bridge gateway (172.17.0.1) instead of host.docker.internal
#   - Upload volume uses Linux path instead of C:/tmp/...
#   - No extra_hosts needed (172.17.0.1 is the standard Docker bridge on Linux)

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-knowledge_assistant}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ka-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-knowledge_assistant}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SERVER_PORT: "8080"
      RAG_SERVICE_URL: http://rag-service:8000
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXBsYWNlaG9sZGVyLXNlY3JldC1rZXktZm9yLWRldi1vbmx5LTMyYg==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      UPLOAD_ROOT_PATH: /app/uploads
      UPLOAD_MAX_SIZE_MB: 50
      UPLOAD_ALLOWED_EXTENSIONS: pdf,txt,md
    ports:
      - "8080:8080"
    volumes:
      - document-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ka-network

  rag-service:
    build: ./rag-service
    environment:
      POSTGRES_HOST: ${DB_HOST:-postgres}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-knowledge_assistant}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # On Linux, containers reach the host via the Docker bridge gateway IP
      # (not host.docker.internal, which is Docker Desktop-only on Windows/Mac)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://172.17.0.1:11434}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-default-dev-key}
      UPLOAD_ROOT_PATH: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - document-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ka-network

volumes:
  pgdata:
  document-uploads:

networks:
  ka-network:
    driver: bridge
